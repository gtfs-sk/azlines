name: "Build & Publish GTFS Feeds"

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "transform/**"
      - "lib/**"
      - "geo.ts"
      - "index.ts"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-osm:
    runs-on: ubuntu-latest
    steps:
      - name: Download Slovakia OSM extract
        run: |
          mkdir -p tmp
          curl -fsSL https://download.geofabrik.de/europe/slovakia-latest.osm.pbf -o tmp/slovakia-latest.osm.pbf

      - name: Upload OSM extract artifact
        uses: actions/upload-artifact@v4
        with:
          name: osm-extract
          path: tmp/slovakia-latest.osm.pbf

  build:
    needs: fetch-osm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        city: [pezinok, malacky, topolcany]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies
        run: bun install

      - name: Unpack base feed
        run: bash fetch/unpackFeed.sh ${{ matrix.city }}

      - name: Download OSM extract artifact
        uses: actions/download-artifact@v4
        with:
          name: osm-extract
          path: tmp

      - name: Transform feed
        run: bun run transform/${{ matrix.city }}/index.ts

      - name: Upload pre-pfaedle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-pfaedle-${{ matrix.city }}
          path: data/${{ matrix.city }}

  pfaedle:
    needs: [fetch-osm, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        city: [pezinok, malacky, topolcany]
    container:
      image: ghcr.io/ad-freiburg/pfaedle:latest

    steps:
      - name: Download pre-pfaedle artifact
        uses: actions/download-artifact@v4
        with:
          name: pre-pfaedle-${{ matrix.city }}
          path: data/${{ matrix.city }}

      - name: Download OSM extract artifact
        uses: actions/download-artifact@v4
        with:
          name: osm-extract
          path: tmp

      - name: Run pfaedle
        run: pfaedle -x tmp/slovakia-latest.osm.pbf data/${{ matrix.city }} -F --inplace --mots bus --drop-shapes true

      - name: Upload pfaedled artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfaedled-${{ matrix.city }}
          path: data/${{ matrix.city }}

  package:
    needs: [build, pfaedle]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        city: [pezinok, malacky, topolcany]
    steps:
      - name: Download pfaedled artifact
        uses: actions/download-artifact@v4
        with:
          name: pfaedled-${{ matrix.city }}
          path: data/${{ matrix.city }}

      - name: Package GTFS feed
        run: |
          mkdir -p public
          (cd data/${{ matrix.city }} && zip -r ../../public/${{ matrix.city }}.zip .)

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-feed-${{ matrix.city }}
          path: public

  gtfs-to-html:
    needs: pfaedle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Download pezinok pfaedled artifact
        uses: actions/download-artifact@v4
        with:
          name: pfaedled-pezinok
          path: fragment/pezinok

      - name: Download malacky pfaedled artifact
        uses: actions/download-artifact@v4
        with:
          name: pfaedled-malacky
          path: fragment/malacky

      - name: Download topolcany pfaedled artifact
        uses: actions/download-artifact@v4
        with:
          name: pfaedled-topolcany
          path: fragment/topolcany

      - name: Build HTML timetables
        run: bunx gtfs-to-html --configPath ./keep/gtfs-to-html.config.json

      - name: Upload HTML timetables artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-to-html
          path: fragment/html

  deploy:
    needs: [package, gtfs-to-html]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all feed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gtfs-feed-*
          path: fragment
          merge-multiple: true

      - name: Download HTML timetables artifact
        uses: actions/download-artifact@v4
        with:
          name: gtfs-to-html
          path: fragment

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "fragment"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
